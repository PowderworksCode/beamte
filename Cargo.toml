[package]
name = "beamte"
version = "0.0.0"
edition = "2024"
description = "Test-quality rules over treebank trees. Trees in, findings out."
repository = "https://github.com/PowderworksCode/beamte"
publish = false

# The published library has no dependencies at all. `dev` adds a parser and a
# binary so rules can be developed against real files; DESIGN.md §8 explains
# why that costs consumers nothing.
[features]
default = []
dev = ["dep:tree-sitter", "dep:treebank-python", "dep:serde_json"]

[dependencies]
tree-sitter = { version = "0.26", optional = true }
serde_json = { version = "1", optional = true }
# Not on crates.io yet, so a git dependency rather than a path one: this
# resolves anywhere with repo access, where a path dependency would need a
# full powderworks/ checkout. It is optional and off by default, so it never
# reaches a consumer. It does block `cargo publish` until treebank is
# released, which is why the crate is `publish = false` for now.
treebank-python = { git = "https://github.com/PowderworksCode/treebank", optional = true }

[[bin]]
name = "beamte"
path = "src/bin/beamte.rs"
required-features = ["dev"]

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
