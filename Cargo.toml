[workspace]
members = ["dev"]

# Shared so the library and the harness are held to the same standard; a rule
# developed under looser lints than it ships under is a rule found twice.
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[package]
name = "beamte"
version = "0.2.0"
edition = "2024"
description = "Test-quality rules over treebank trees. Trees in, findings out."
repository = "https://github.com/PowderworksCode/beamte"
documentation = "https://docs.rs/beamte"
readme = "README.md"
license = "MIT"
keywords = ["testing", "lint", "static-analysis", "tree-sitter", "test-quality"]
categories = ["development-tools::testing", "development-tools"]

# The published library has one dependency and can be built with none.
# Developing a rule means running it against a real file, which needs a parser
# and a grammar; both live in the `beamte-dev` crate beside this one, which is
# never published. notes/DESIGN.md §8 explains why that costs consumers nothing.
[features]
# `manifests` reads a grammar's node-types.json and roles.json into a role
# table. On by default because every host needs it and doing it per host is
# how two hosts come to disagree; `default-features = false` still gives a
# library with no dependencies at all. It reads them with treebank's own
# types -- notes/DESIGN.md has always said the vocabulary comes from treebank, and
# a second reading of the same manifests is how the two come to disagree
# about what derives from what.
default = ["manifests"]
manifests = ["dep:treebank"]

[dependencies]
# Vocabulary only. `pack` and `fetch` are treebank's defaults and would drag
# in a wasm engine and an HTTP stack -- 238 crates against 14 -- into a
# library whose whole premise is that it links neither.
treebank = { version = "0.3", default-features = false, optional = true }

[lints]
workspace = true
