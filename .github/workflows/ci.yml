name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # DESIGN.md 8.3 gate 1. The published library has no dependencies and no
  # parser; building it without `dev` is what proves nothing dev-gated became
  # reachable from the API.
  library:
    name: library (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The claim in Cargo.toml is that `default-features = false` leaves a
      # library with no dependencies at all. Checked, not asserted.
      - run: cargo build --locked --no-default-features
      - name: no dependencies without default features
        run: |
          set -euo pipefail
          deps=$(cargo tree --locked --no-default-features --prefix none | sort -u | grep -v '^beamte ' | wc -l)
          [ "$deps" -eq 0 ] || { cargo tree --locked --no-default-features; echo "::error::expected no dependencies, found $deps"; exit 1; }
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # The rules themselves, against treebank's grammar and treebank's roles.
  rules:
    name: rules (dev harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo test --locked --features dev
      - run: cargo clippy --locked --all-targets --features dev -- -D warnings
