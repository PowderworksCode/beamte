name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # DESIGN.md 8.3 gate 1. The published library has no dependencies and no
  # parser; building it without `dev` is what proves nothing dev-gated became
  # reachable from the API.
  library:
    name: library (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The claim in Cargo.toml is that `default-features = false` leaves a
      # library with no dependencies at all. Checked, not asserted.
      - run: cargo build --locked --no-default-features
      - name: no dependencies without default features
        run: |
          set -euo pipefail
          # `grep -vc` with `|| true`: under pipefail a grep that matches
          # nothing exits 1, which is the success case here and would
          # otherwise fail the step for having no dependencies.
          deps=$(cargo tree --locked --no-default-features --prefix none | sort -u | grep -vc '^beamte ' || true)
          if [ "$deps" -ne 0 ]; then
            cargo tree --locked --no-default-features
            echo "::error::expected no dependencies, found $deps"
            exit 1
          fi
          echo "no dependencies without default features"
      # The default library reads grammar manifests, so it takes treebank --
      # but treebank's own defaults are `pack` and `fetch`, which are a wasm
      # engine and an HTTP stack. Turning those on would put 238 crates into
      # a library whose premise is that it links neither, and it would break
      # straitjacket's musl release build, which is the exact failure beamte
      # exists not to cause. `default-features = false` is load-bearing, so
      # it is checked rather than trusted to survive an edit.
      - name: the default library links no engine
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked --prefix none)
          heavy=$(echo "$tree" | grep -Eic 'wasmtime|wasmer|cranelift|ureq|tree-sitter' || true)
          if [ "$heavy" -ne 0 ]; then
            echo "$tree" | grep -Ei 'wasmtime|wasmer|cranelift|ureq|tree-sitter'
            echo "::error::the default library pulled in an engine or a parser"
            exit 1
          fi
          echo "no engine, no parser, no HTTP stack in the default tree"
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  # The rules themselves, against treebank's grammar and treebank's roles.
  rules:
    name: rules (dev harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
